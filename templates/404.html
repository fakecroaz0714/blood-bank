{% extends 'base.html' %}

{% block title %}Page Not Found - BloodConnect{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4 p-5">
                <div class="mb-4">
                    <span class="blood-badge blood-badge-lg mx-auto mb-3">
                        <i class="bi bi-question-circle-fill"></i>
                    </span>
                    <h1 class="fw-bold text-danger display-4">404</h1>
                    <h4 class="fw-bold text-dark">Page Not Found</h4>
                    <p class="text-muted small mt-2">
                        The requested page could not be located. It might have been moved or removed.
                    </p>
                </div>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url_for('index') }}" class="btn btn-blood px-4">
                        <i class="bi bi-house-door me-1"></i> Back to Home
                    </a>
                    <a href="{{ url_for('search_donors') }}" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-search me-1"></i> Find Donors
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
